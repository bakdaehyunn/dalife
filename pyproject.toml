[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dalife"
version = "0.1.0"
description = "DaLife: personal recommendations and routines backed by a local context archive"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dalife contributors" }]
dependencies = ["pyoxigraph==0.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dalife = "dalife.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
